[project]
name = "fkey"
version = "0.1.0"
description = "A personal taste database managed by AI agents over MCP"
readme = "README.md"
authors = [
    { name = "Dima Kuchin", email = "dima@kuchin.net" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "python-dotenv>=1.2.1",
    "redis>=8.1.0",
    "starlette>=0.49.1",
]

[project.scripts]
fkey = "fkey.server:main"
fkey-backup = "fkey.backup:main"

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
