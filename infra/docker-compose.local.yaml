services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["fkey", "--http", "--host", "0.0.0.0", "--port", "8000", "--public"]
    environment:
      FKEY_DATA_DIR: /app/data
      FKEY_PUBLIC_URL: ${FKEY_PUBLIC_URL:-http://localhost:8000}
      FKEY_REDIS_URL: redis://redis:6379/0
      FKEY_SIGNUP_CODE: ${FKEY_SIGNUP_CODE:?set FKEY_SIGNUP_CODE in .env}
      FKEY_TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

