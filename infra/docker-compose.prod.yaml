x-fkey-image: &fkey-image
  image: fkey-app
  build:
    context: .
    dockerfile: Dockerfile

services:
  app:
    <<: *fkey-image
    command: ["fkey", "--http", "--host", "0.0.0.0", "--port", "8000", "--public"]
    environment:
      FKEY_DATA_DIR: /app/data
      FKEY_PUBLIC_URL: https://beta.fkey.app
      FKEY_REDIS_URL: redis://redis:6379/0
      FKEY_SIGNUP_CODE: ${FKEY_SIGNUP_CODE:?set FKEY_SIGNUP_CODE in .env}
      FKEY_TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:9040:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backup:
    <<: *fkey-image
    command:
      - sh
      - -c
      - while true; do fkey-backup --once-per-day /app/data /app/backups; sleep 21600; done
    volumes:
      - ./data:/app/data:ro
      - ./backups:/app/backups
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped
